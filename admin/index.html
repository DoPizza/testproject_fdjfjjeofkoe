<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Админ-панель</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        button {
            border: none;

            padding: 9px 14px;

            border-radius: 7px;

            background: #222;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .event {
            background: white;

            padding: 18px;

            margin-bottom: 12px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .event-title {
            margin-bottom: 8px;

            font-size: 19px;
            font-weight: bold;
        }

        .event-info {
            color: #666;

            font-size: 14px;

            line-height: 1.7;
        }

        .status {
            display: inline-block;

            margin-top: 10px;
            margin-right: 8px;

            padding: 4px 8px;

            border-radius: 5px;

            background: #eee;

            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 15px;
        }

        .edit-button {
            background: #333;
        }

        .delete-button {
            background: #c62828;
        }

        .status-button {
            background: #555;
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: #777;
        }

        .error {
            padding: 20px;

            background: #ffe8e8;

            color: #c00;

            border-radius: 8px;
        }


        /* ======================================
           МОДАЛЬНОЕ ОКНО
           ====================================== */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.55);

            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 25px;

            background: white;

            border-radius: 12px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            background: transparent;

            color: #222;

            font-size: 25px;

            padding: 0;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 6px;

            font-size: 14px;
            font-weight: bold;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-family: inherit;

            font-size: 14px;
        }

        .field textarea {
            min-height: 100px;

            resize: vertical;
        }

        .checkbox-field {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 15px;
        }

        .checkbox-field input {
            width: 18px;
            height: 18px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;

            gap: 8px;

            margin-top: 20px;
        }

        .cancel-button {
            background: #ddd;
            color: #222;
        }


        /* ======================================
           УВЕДОМЛЕНИЕ
           ====================================== */

        .message {
            position: fixed;

            right: 20px;
            bottom: 20px;

            padding: 12px 16px;

            background: #222;
            color: white;

            border-radius: 8px;

            display: none;

            z-index: 2000;
        }

        .message.active {
            display: block;
        }

    </style>

</head>


<body>

    <div class="container">

        <header>

            <h1>
                Админ-панель
            </h1>

            <button onclick="loadEvents()">
                Обновить
            </button>

        </header>


        <div id="events">

            <div class="loading">
                Загрузка...
            </div>

        </div>

    </div>


    <!-- ======================================
         МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ
         ====================================== -->

    <div
        id="edit-modal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Редактирование
                </h2>

                <button
                    class="close"
                    onclick="closeEditModal()"
                >
                    ×
                </button>

            </div>


            <form id="edit-form">

                <input
                    type="hidden"
                    id="edit-id"
                >


                <div class="field">

                    <label for="edit-title">
                        Название
                    </label>

                    <input
                        type="text"
                        id="edit-title"
                    >

                </div>


                <div class="field">

                    <label for="edit-description">
                        Описание
                    </label>

                    <textarea
                        id="edit-description"
                    ></textarea>

                </div>


                <div class="field">

                    <label for="edit-start-date">
                        Дата начала
                    </label>

                    <input
                        type="datetime-local"
                        id="edit-start-date"
                    >

                </div>


                <div class="field">

                    <label for="edit-end-date">
                        Дата окончания
                    </label>

                    <input
                        type="datetime-local"
                        id="edit-end-date"
                    >

                </div>


                <div class="field">

                    <label for="edit-price">
                        Цена
                    </label>

                    <input
                        type="number"
                        id="edit-price"
                        min="0"
                    >

                </div>


                <div class="field">

                    <label for="edit-image">
                        URL изображения
                    </label>

                    <input
                        type="url"
                        id="edit-image"
                    >

                </div>


                <div class="field">

                    <label for="edit-source">
                        URL источника
                    </label>

                    <input
                        type="url"
                        id="edit-source"
                    >

                </div>


                <div class="field">

                    <label for="edit-broadcaster">
                        Вещатель
                    </label>

                    <input
                        type="text"
                        id="edit-broadcaster"
                    >

                </div>


                <div class="field">

                    <label for="edit-status">
                        Статус
                    </label>

                    <select id="edit-status">

                        <option value="pending">
                            pending
                        </option>

                        <option value="approved">
                            approved
                        </option>

                        <option value="rejected">
                            rejected
                        </option>

                    </select>

                </div>


                <label class="checkbox-field">

                    <input
                        type="checkbox"
                        id="edit-age"
                    >

                    <span>
                        18+
                    </span>

                </label>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="closeEditModal()"
                    >
                        Отмена
                    </button>

                    <button
                        type="submit"
                    >
                        Сохранить
                    </button>

                </div>

            </form>

        </div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <script>

        const API_URL =
            "https://fangdenim-lwsvow.stormkit.dev/api/events";


        // ======================================
        // ЗАГРУЗКА МЕРОПРИЯТИЙ
        // ======================================

        async function loadEvents() {

            const container =
                document.getElementById("events");


            container.innerHTML = `
                <div class="loading">
                    Загрузка...
                </div>
            `;


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const events =
                    await response.json();


                if (
                    !Array.isArray(events) ||
                    events.length === 0
                ) {

                    container.innerHTML = `
                        <div class="loading">
                            Мероприятий нет
                        </div>
                    `;

                    return;

                }


                container.innerHTML =
                    events.map(event => `

                        <div
                            class="event"
                            data-id="${event.id}"
                        >

                            <div class="event-title">
                                ${escapeHTML(
                                    event.title || "Без названия"
                                )}
                            </div>


                            <div class="event-info">

                                ID:
                                ${event.id || "—"}

                                <br>

                                Дата:
                                ${event.start_date || "—"}

                                <br>

                                Цена:
                                ${
                                    event.price !== null &&
                                    event.price !== undefined
                                        ? event.price + " ₽"
                                        : "—"
                                }

                                <br>

                                Вещатель:
                                ${escapeHTML(
                                    event.broadcaster || "—"
                                )}

                            </div>


                            ${
                                event.status
                                    ? `
                                        <div class="status">
                                            ${escapeHTML(event.status)}
                                        </div>
                                    `
                                    : ""
                            }


                            <div class="actions">

                                <button
                                    class="edit-button"
                                    onclick='openEditModal(${JSON.stringify(event)})'
                                >
                                    ✏️ Редактировать
                                </button>


                                <button
                                    class="status-button"
                                    onclick="changeStatus(${event.id})"
                                >
                                    🔄 Изменить статус
                                </button>


                                <button
                                    class="delete-button"
                                    onclick="deleteEvent(${event.id})"
                                >
                                    🗑️ Удалить
                                </button>

                            </div>

                        </div>

                    `).join("");


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        Не удалось загрузить мероприятия.

                        <br><br>

                        ${escapeHTML(error.message)}

                    </div>

                `;

            }

        }


        // ======================================
        // ОТКРЫТИЕ РЕДАКТИРОВАНИЯ
        // ======================================

        function openEditModal(event) {

            document.getElementById("edit-id").value =
                event.id || "";


            document.getElementById("edit-title").value =
                event.title || "";


            document.getElementById("edit-description").value =
                event.description || "";


            document.getElementById("edit-start-date").value =
                toLocalDateTime(event.start_date);


            document.getElementById("edit-end-date").value =
                toLocalDateTime(event.end_date);


            document.getElementById("edit-price").value =
                event.price ?? "";


            document.getElementById("edit-image").value =
                event.image_url || "";


            document.getElementById("edit-source").value =
                event.source_url || "";


            document.getElementById("edit-broadcaster").value =
                event.broadcaster || "";


            document.getElementById("edit-status").value =
                event.status || "pending";


            document.getElementById("edit-age").checked =
                event["18+"] === true;


            document
                .getElementById("edit-modal")
                .classList.add("active");

        }


        // ======================================
        // ЗАКРЫТИЕ РЕДАКТИРОВАНИЯ
        // ======================================

        function closeEditModal() {

            document
                .getElementById("edit-modal")
                .classList.remove("active");

        }


        // ======================================
        // СОХРАНЕНИЕ РЕДАКТИРОВАНИЯ
        // ======================================

        document
            .getElementById("edit-form")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const id =
                        document.getElementById(
                            "edit-id"
                        ).value;


                    const data = {

                        title:
                            document.getElementById(
                                "edit-title"
                            ).value,

                        description:
                            document.getElementById(
                                "edit-description"
                            ).value,

                        start_date:
                            document.getElementById(
                                "edit-start-date"
                            ).value
                            || null,

                        end_date:
                            document.getElementById(
                                "edit-end-date"
                            ).value
                            || null,

                        price:
                            document.getElementById(
                                "edit-price"
                            ).value
                            === ""
                                ? null
                                : Number(
                                    document.getElementById(
                                        "edit-price"
                                    ).value
                                ),

                        image_url:
                            document.getElementById(
                                "edit-image"
                            ).value,

                        source_url:
                            document.getElementById(
                                "edit-source"
                            ).value,

                        broadcaster:
                            document.getElementById(
                                "edit-broadcaster"
                            ).value,

                        status:
                            document.getElementById(
                                "edit-status"
                            ).value,

                        "18+":
                            document.getElementById(
                                "edit-age"
                            ).checked

                    };


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/${id}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(data)
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                `HTTP ${response.status}`
                            );

                        }


                        showMessage(
                            "Мероприятие сохранено"
                        );


                        closeEditModal();


                        loadEvents();


                    } catch (error) {

                        console.error(error);

                        showMessage(
                            "Ошибка: " +
                            error.message
                        );

                    }

                }
            );


        


        async function changeStatus(id) {

            const status =
                prompt(
                    "Введите новый статус:\n\npending\napproved\nrejected"
                );

            if (status === null) {
                return;
            }

            const newStatus =
                status.trim();

            if (!newStatus) {

                alert(
                    "Статус не может быть пустым."
                );

                return;

            }

            try {

                const response =
                    await fetch(
                        `${API_URL}/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    status: newStatus
                                })
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        `HTTP ${response.status}`
                    );

                }

                showMessage(
                    "Статус изменён"
                );

                loadEvents();

            } catch (error) {

                console.error(error);

                showMessage(
                    "Ошибка: " +
                    error.message
                );

            }

        }
        // ======================================
        // УДАЛЕНИЕ
        // ======================================

        async function deleteEvent(id) {

            const confirmed =
                confirm(
                    "Удалить это мероприятие?\n\n" +
                    "Это действие нельзя отменить."
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        `HTTP ${response.status}`
                    );

                }


                showMessage(
                    "Мероприятие удалено"
                );


                loadEvents();


            } catch (error) {

                console.error(error);

                showMessage(
                    "Ошибка: " +
                    error.message
                );

            }

        }


        // ======================================
        // ФОРМАТ ДАТЫ ДЛЯ INPUT
        // ======================================

        function toLocalDateTime(dateString) {

            if (!dateString) {
                return "";
            }


            const date =
                new Date(dateString);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            const hours =
                String(
                    date.getHours()
                ).padStart(2, "0");


            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, "0");


            return `${year}-${month}-${day}T${hours}:${minutes}`;

        }


        // ======================================
        // ЭКРАНИРОВАНИЕ HTML
        // ======================================

        function escapeHTML(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        // ======================================
        // УВЕДОМЛЕНИЕ
        // ======================================

        function showMessage(text) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.classList.add(
                "active"
            );


            setTimeout(
                () => {

                    message.classList.remove(
                        "active"
                    );

                },
                2500
            );

        }


        // ======================================
        // ЗАКРЫТИЕ МОДАЛКИ ПО КЛИКУ НА ФОН
        // ======================================

        document
            .getElementById("edit-modal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeEditModal();

                    }

                }
            );


        // ======================================
        // ЗАПУСК
        // ======================================

        loadEvents();

    </script>

</body>

</html>
