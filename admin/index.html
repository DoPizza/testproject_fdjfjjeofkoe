<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Админ-панель — Афиша Ульяновска</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
        }


        /* ================================
           HEADER
           ================================ */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        h1 {
            margin: 0;

            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }


        /* ================================
           BUTTONS
           ================================ */

        button {
            border: none;

            padding: 10px 14px;

            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 14px;

            cursor: pointer;

            transition:
                opacity .15s,
                transform .1s;
        }

        button:hover {
            opacity: .85;
        }

        button:active {
            transform: scale(.98);
        }


        /* ================================
           FILTERS
           ================================ */

        .filters {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: white;

            font-family: inherit;

            font-size: 14px;
        }

        .filters input {
            flex: 1;
        }

        .filters select {
            max-width: 180px;
        }


        /* ================================
           EVENTS
           ================================ */

        .event {
            display: grid;

            grid-template-columns: 130px 1fr;

            gap: 18px;

            margin-bottom: 12px;

            padding: 15px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);
        }

        .event-image {
            width: 130px;
            height: 130px;

            object-fit: contain;

            border-radius: 8px;

            background: #f0f0f0;
        }

        .event-image.empty {
            display: flex;

            align-items: center;
            justify-content: center;

            color: #999;

            font-size: 13px;
        }

        .event-title {
            margin-bottom: 8px;

            font-size: 19px;
            font-weight: bold;
        }

        .event-info {
            color: #666;

            font-size: 14px;

            line-height: 1.7;
        }

        .event-info strong {
            color: #333;
        }


        /* ================================
           STATUS
           ================================ */

        .status {
            display: inline-block;

            margin-top: 10px;

            padding: 5px 9px;

            border-radius: 6px;

            background: #eee;

            font-size: 13px;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.approved {
            background: #d4edda;
            color: #155724;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }


        /* ================================
           ACTIONS
           ================================ */

        .actions {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 14px;
        }

        .edit-button {
            background: #333;
        }

        .status-button {
            background: #555;
        }

        .delete-button {
            background: #c62828;
        }


        /* ================================
           LOADING / EMPTY / ERROR
           ================================ */

        .loading,
        .empty {
            padding: 40px;

            text-align: center;

            color: #777;
        }

        .error {
            padding: 20px;

            border-radius: 10px;

            background: #ffe8e8;

            color: #c00;
        }


        /* ================================
           MODAL
           ================================ */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, .55);

            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 620px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 25px;

            background: white;

            border-radius: 12px;
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            padding: 0 5px;

            background: transparent;

            color: #222;

            font-size: 28px;
        }


        /* ================================
           FORM
           ================================ */

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 6px;

            font-size: 14px;
            font-weight: bold;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-family: inherit;

            font-size: 14px;
        }

        .field textarea {
            min-height: 110px;

            resize: vertical;
        }

        .checkbox-field {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 15px;
        }

        .checkbox-field input {
            width: 18px;
            height: 18px;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            margin-top: 20px;
        }

        .cancel-button {
            background: #ddd;
            color: #222;
        }


        /* ================================
           NOTIFICATION
           ================================ */

        .message {
            position: fixed;

            right: 20px;
            bottom: 20px;

            display: none;

            padding: 12px 16px;

            border-radius: 8px;

            background: #222;
            color: white;

            z-index: 2000;
        }

        .message.active {
            display: block;
        }


        /* ================================
           MOBILE
           ================================ */

        @media (max-width: 650px) {

            body {
                padding: 20px 10px;
            }

            header {
                align-items: flex-start;

                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .filters select {
                max-width: none;
            }

            .event {
                grid-template-columns: 1fr;
            }

            .event-image {
                width: 100%;
                height: 180px;
            }

            .actions {
                flex-direction: column;
            }

            .actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <header>

        <h1>
            Админ-панель
        </h1>

        <div class="header-actions">

            <button onclick="loadEvents()">
                🔄 Обновить
            </button>

        </div>

    </header>


    <!-- ФИЛЬТРЫ -->

    <div class="filters">

        <input
            type="search"
            id="search"
            placeholder="Поиск по названию..."
            oninput="renderEvents()"
        >

        <select
            id="status-filter"
            onchange="renderEvents()"
        >

            <option value="">
                Все статусы
            </option>

            <option value="pending">
                pending
            </option>

            <option value="approved">
                approved
            </option>

            <option value="rejected">
                rejected
            </option>

        </select>

    </div>


    <!-- МЕРОПРИЯТИЯ -->

    <div id="events">

        <div class="loading">
            Загрузка...
        </div>

    </div>

</div>


<!-- ======================================
     МОДАЛЬНОЕ ОКНО
     ====================================== -->

<div
    id="edit-modal"
    class="modal"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2>
                Редактирование
            </h2>

            <button
                class="close"
                onclick="closeEditModal()"
            >
                ×
            </button>

        </div>


        <form id="edit-form">


            <input
                type="hidden"
                id="edit-id"
            >


            <div class="field">

                <label>
                    Название
                </label>

                <input
                    type="text"
                    id="edit-title"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Описание
                </label>

                <textarea
                    id="edit-description"
                ></textarea>

            </div>


            <div class="field">

                <label>
                    Дата начала
                </label>

                <input
                    type="datetime-local"
                    id="edit-start-date"
                >

            </div>


            <div class="field">

                <label>
                    Дата окончания
                </label>

                <input
                    type="datetime-local"
                    id="edit-end-date"
                >

            </div>


            <div class="field">

                <label>
                    Цена
                </label>

                <input
                    type="number"
                    id="edit-price"
                    min="0"
                >

            </div>


            <div class="field">

                <label>
                    URL изображения
                </label>

                <input
                    type="url"
                    id="edit-image"
                >

            </div>


            <div class="field">

                <label>
                    URL источника
                </label>

                <input
                    type="url"
                    id="edit-source"
                >

            </div>


            <div class="field">

                <label>
                    Вещатель
                </label>

                <input
                    type="text"
                    id="edit-broadcaster"
                >

            </div>


            <div class="field">

                <label>
                    Статус
                </label>

                <select id="edit-status">

                    <option value="pending">
                        pending
                    </option>

                    <option value="approved">
                        approved
                    </option>

                    <option value="rejected">
                        rejected
                    </option>

                </select>

            </div>


            <label class="checkbox-field">

                <input
                    type="checkbox"
                    id="edit-age"
                >

                <span>
                    18+
                </span>

            </label>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closeEditModal()"
                >
                    Отмена
                </button>

                <button type="submit">
                    Сохранить
                </button>

            </div>


        </form>

    </div>

</div>


<div
    id="message"
    class="message"
></div>


<script>


/* ======================================
   API
   ====================================== */

const API_URL =
    "https://astonishing-pastelito-e6e568.netlify.app/api";


let allEvents = [];


/* ======================================
   ЗАГРУЗКА
   ====================================== */

async function loadEvents() {

    const container =
        document.getElementById("events");

    container.innerHTML = `
        <div class="loading">
            Загрузка...
        </div>
    `;

    try {

        const response =
            await fetch(
                `${API_URL}/events`
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        allEvents =
            await response.json();

        renderEvents();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Не удалось загрузить мероприятия.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* ======================================
   ОТОБРАЖЕНИЕ
   ====================================== */

function renderEvents() {

    const container =
        document.getElementById("events");

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const status =
        document
            .getElementById("status-filter")
            .value;


    const events =
        allEvents.filter(event => {

            const title =
                String(
                    event.title || ""
                ).toLowerCase();

            const matchesSearch =
                !search ||
                title.includes(search);

            const matchesStatus =
                !status ||
                event.status === status;

            return (
                matchesSearch &&
                matchesStatus
            );

        });


    if (events.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Мероприятий не найдено
            </div>
        `;

        return;

    }


    container.innerHTML =
        events.map(event => {

            const image =
                event.image_url
                    ? `
                        <img
                            class="event-image"
                            src="${escapeAttribute(event.image_url)}"
                            alt=""
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >
                    `
                    : `
                        <div class="event-image empty">
                            Нет изображения
                        </div>
                    `;


            return `

                <div
                    class="event"
                    data-id="${event.id}"
                >

                    <div>
                        ${image}
                    </div>


                    <div>

                        <div class="event-title">

                            ${escapeHTML(
                                event.title ||
                                "Без названия"
                            )}

                        </div>


                        <div class="event-info">

                            <strong>ID:</strong>
                            ${event.id ?? "—"}

                            <br>

                            <strong>Начало:</strong>
                            ${formatDate(
                                event.start_date
                            )}

                            <br>

                            <strong>Окончание:</strong>
                            ${formatDate(
                                event.end_date
                            )}

                            <br>

                            <strong>Цена:</strong>
                            ${
                                event.price !== null &&
                                event.price !== undefined
                                    ? `${event.price} ₽`
                                    : "—"
                            }

                            <br>

                            <strong>Вещатель:</strong>
                            ${escapeHTML(
                                event.broadcaster ||
                                "—"
                            )}

                            <br>

                            <strong>18+:</strong>
                            ${event["18+"] === true
                                ? "Да"
                                : "Нет"
                            }

                        </div>


                        ${
                            event.status
                                ? `
                                    <div
                                        class="
                                            status
                                            ${escapeAttribute(
                                                event.status
                                            )}
                                        "
                                    >
                                        ${escapeHTML(
                                            event.status
                                        )}
                                    </div>
                                `
                                : ""
                        }


                        <div class="actions">

                            <button
                                class="edit-button"
                                onclick="openEditModal(${event.id})"
                            >
                                ✏️ Редактировать
                            </button>


                            <button
                                class="status-button"
                                onclick="changeStatus(${event.id})"
                            >
                                🔄 Статус
                            </button>


                            <button
                                class="delete-button"
                                onclick="deleteEvent(${event.id})"
                            >
                                🗑️ Удалить
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* ======================================
   ОТКРЫТИЕ РЕДАКТИРОВАНИЯ
   ====================================== */

function openEditModal(id) {

    const event =
        allEvents.find(
            item => Number(item.id) === Number(id)
        );

    if (!event) {

        showMessage(
            "Мероприятие не найдено"
        );

        return;

    }


    document.getElementById("edit-id").value =
        event.id ?? "";


    document.getElementById("edit-title").value =
        event.title ?? "";


    document.getElementById("edit-description").value =
        event.description ?? "";


    document.getElementById("edit-start-date").value =
        toLocalDateTime(event.start_date);


    document.getElementById("edit-end-date").value =
        toLocalDateTime(event.end_date);


    document.getElementById("edit-price").value =
        event.price ?? "";


    document.getElementById("edit-image").value =
        event.image_url ?? "";


    document.getElementById("edit-source").value =
        event.source_url ?? "";


    document.getElementById("edit-broadcaster").value =
        event.broadcaster ?? "";


    document.getElementById("edit-status").value =
        event.status ?? "pending";


    document.getElementById("edit-age").checked =
        event["18+"] === true;


    document
        .getElementById("edit-modal")
        .classList.add("active");

}


/* ======================================
   ЗАКРЫТИЕ
   ====================================== */

function closeEditModal() {

    document
        .getElementById("edit-modal")
        .classList.remove("active");

}


/* ======================================
   СОХРАНЕНИЕ
   ====================================== */

document
    .getElementById("edit-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const id =
                document
                    .getElementById("edit-id")
                    .value;


            const data = {

                id: Number(id),

                title:
                    document
                        .getElementById("edit-title")
                        .value
                        .trim(),

                description:
                    document
                        .getElementById("edit-description")
                        .value
                        .trim()
                        || null,

                start_date:
                    localToISOString(
                        document
                            .getElementById("edit-start-date")
                            .value
                    ),

                end_date:
                    localToISOString(
                        document
                            .getElementById("edit-end-date")
                            .value
                    ),

                price:
                    document
                        .getElementById("edit-price")
                        .value === ""
                        ? null
                        : Number(
                            document
                                .getElementById("edit-price")
                                .value
                        ),

                image_url:
                    document
                        .getElementById("edit-image")
                        .value
                        .trim()
                        || null,

                source_url:
                    document
                        .getElementById("edit-source")
                        .value
                        .trim()
                        || null,

                broadcaster:
                    document
                        .getElementById("edit-broadcaster")
                        .value
                        .trim()
                        || null,

                status:
                    document
                        .getElementById("edit-status")
                        .value,

                "18+":
                    document
                        .getElementById("edit-age")
                        .checked

            };


            try {

                const response =
                    await fetch(
                        `${API_URL}/events/update`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        `HTTP ${response.status}`
                    );

                }


                showMessage(
                    "Мероприятие сохранено"
                );


                closeEditModal();


                await loadEvents();

            } catch (error) {

                console.error(error);

                showMessage(
                    "Ошибка: " +
                    error.message
                );

            }

        }
    );


/* ======================================
   БЫСТРОЕ ИЗМЕНЕНИЕ СТАТУСА
   ====================================== */

async function changeStatus(id) {

    const event =
        allEvents.find(
            item => Number(item.id) === Number(id)
        );

    if (!event) {
        return;
    }


    const status =
        prompt(
            "Введите статус:\n\npending\napproved\nrejected",
            event.status || "pending"
        );


    if (status === null) {
        return;
    }


    const newStatus =
        status.trim();


    if (
        ![
            "pending",
            "approved",
            "rejected"
        ].includes(newStatus)
    ) {

        alert(
            "Допустимые статусы:\npending\napproved\nrejected"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/events/update`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id: Number(id),
                            status: newStatus
                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                `HTTP ${response.status}`
            );

        }


        showMessage(
            "Статус изменён"
        );


        await loadEvents();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ошибка: " +
            error.message
        );

    }

}


/* ======================================
   УДАЛЕНИЕ
   ====================================== */

async function deleteEvent(id) {

    const event =
        allEvents.find(
            item => Number(item.id) === Number(id)
        );


    const title =
        event?.title ||
        "это мероприятие";


    if (
        !confirm(
            `Удалить «${title}»?\n\n` +
            "Это действие нельзя отменить."
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/events/delete?id=${encodeURIComponent(id)}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                `HTTP ${response.status}`
            );

        }


        showMessage(
            "Мероприятие удалено"
        );


        await loadEvents();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ошибка: " +
            error.message
        );

    }

}


/* ======================================
   ДАТЫ
   ====================================== */

function toLocalDateTime(dateString) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const hours =
        String(
            date.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    return (
        `${year}-${month}-${day}` +
        `T${hours}:${minutes}`
    );

}


function localToISOString(value) {

    if (!value) {
        return null;
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;

    }


    return date.toISOString();

}


function formatDate(value) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";

    }


    return date.toLocaleString(
        "ru-RU",
        {
            dateStyle: "short",
            timeStyle: "short"
        }
    );

}


/* ======================================
   HTML ESCAPE
   ====================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* ======================================
   УВЕДОМЛЕНИЕ
   ====================================== */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "active"
    );


    setTimeout(
        () => {

            message.classList.remove(
                "active"
            );

        },
        2500
    );

}


/* ======================================
   ЗАКРЫТИЕ ПО ФОНУ
   ====================================== */

document
    .getElementById("edit-modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeEditModal();

            }

        }
    );


/* ======================================
   ESC
   ====================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeEditModal();

        }

    }
);


/* ======================================
   START
   ====================================== */

loadEvents();

</script>
