<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Админка мероприятий</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 5px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 8px 14px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
        }

        .event {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .event h3 {
            margin-top: 0;
        }

        .form {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .field {
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- ВХОД -->
    <!-- ========================================= -->

    <div id="loginBlock">

        <h2>
            Вход в админку
        </h2>


        <div class="field">

            <label>
                Email
            </label>

            <br>

            <input
                id="email"
                type="email"
                placeholder="Email"
            >

        </div>


        <div class="field">

            <label>
                Пароль
            </label>

            <br>

            <input
                id="password"
                type="password"
                placeholder="Пароль"
            >

        </div>


        <button id="login">
            Войти
        </button>


        <p id="loginResult"></p>

    </div>



    <!-- ========================================= -->
    <!-- АДМИНКА -->
    <!-- ========================================= -->

    <div
        id="adminBlock"
        class="hidden"
    >


        <h2>
            Админка мероприятий
        </h2>


        <p>
            Вы вошли в админку
        </p>


        <button id="logout">
            Выйти
        </button>


        <button id="loadEvents">
            Обновить мероприятия
        </button>


        <button id="createEventButton">
            Создать мероприятие
        </button>



        <!-- ===================================== -->
        <!-- ФОРМА СОЗДАНИЯ / РЕДАКТИРОВАНИЯ -->
        <!-- ===================================== -->

        <div
            id="eventForm"
            class="form hidden"
        >

            <h3 id="formTitle">
                Создать мероприятие
            </h3>


            <!-- Название -->

            <div class="field">

                <label>
                    Название
                </label>

                <br>

                <input
                    id="eventTitle"
                    type="text"
                    placeholder="Название мероприятия"
                >

            </div>



            <!-- Статус -->

            <div class="field">

                <label>
                    Статус
                </label>

                <br>

                <select id="eventStatus">

                    <option value="pending">
                        pending
                    </option>

                    <option value="approved">
                        approved
                    </option>

                    <option value="rejected">
                        rejected
                    </option>

                </select>

            </div>



            <!-- Описание -->

            <div class="field">

                <label>
                    Описание
                </label>

                <br>

                <textarea
                    id="eventDescription"
                    placeholder="Описание мероприятия"
                ></textarea>

            </div>



            <!-- Дата начала -->

            <div class="field">

                <label>
                    Дата начала
                </label>

                <br>

                <input
                    id="eventStartDate"
                    type="datetime-local"
                >

            </div>



            <!-- Дата окончания -->

            <div class="field">

                <label>
                    Дата окончания
                </label>

                <br>

                <input
                    id="eventEndDate"
                    type="datetime-local"
                >

            </div>



            <!-- Цена -->

            <div class="field">

                <label>
                    Цена
                </label>

                <br>

                <input
                    id="eventPrice"
                    type="number"
                    placeholder="Цена"
                >

            </div>



            <!-- Изображение -->

            <div class="field">

                <label>
                    Ссылка на изображение
                </label>

                <br>

                <input
                    id="eventImage"
                    type="url"
                    placeholder="https://..."
                >

            </div>



            <!-- Ссылка на источник -->

            <div class="field">

                <label>
                    Ссылка на источник
                </label>

                <br>

                <input
                    id="eventSourceUrl"
                    type="url"
                    placeholder="https://..."
                >

            </div>



            <!-- Организатор -->

            <div class="field">

                <label>
                    Организатор
                </label>

                <br>

                <input
                    id="eventBroadcaster"
                    type="text"
                    placeholder="Название организатора"
                >

            </div>



            <!-- 18+ -->

            <div class="field">

                <label>

                    <input
                        id="event18"
                        type="checkbox"
                        style="width: auto;"
                    >

                    18+

                </label>

            </div>



            <!-- Кнопки формы -->

            <button id="saveEvent">
                Сохранить
            </button>


            <button id="cancelForm">
                Отмена
            </button>


            <p id="formResult"></p>

        </div>



        <!-- ===================================== -->
        <!-- СПИСОК МЕРОПРИЯТИЙ -->
        <!-- ===================================== -->

        <h3>
            Все мероприятия
        </h3>


        <div id="events">

            Загрузка...

        </div>


    </div>



    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script type="module">


        // =========================================
        // SUPABASE
        // =========================================

        import { createClient } from
            "https://esm.sh/@supabase/supabase-js";



        const supabase = createClient(

            "https://tgyqyrullvofkezmqrkj.supabase.co",

            "sb_publishable_eGu4ybXLAizBBASrAXUVqw_UnFURjBt"

        );



        // =========================================
        // BACKEND
        // =========================================

        const API_URL =
            "https://astonishing-pastelito-e6e568.netlify.app";



        // =========================================
        // JWT
        // =========================================

        let token = null;



        // ID редактируемого мероприятия

        let editingEventId = null;



        // =========================================
        // ВХОД
        // =========================================

        document.getElementById("login").onclick =
            async () => {


                const email =
                    document.getElementById("email").value;


                const password =
                    document.getElementById("password").value;



                const { data, error } =
                    await supabase.auth.signInWithPassword({

                        email: email,

                        password: password

                    });



                if (error) {

                    document.getElementById("loginResult")
                        .textContent =
                        "Ошибка: " + error.message;

                    return;

                }



                // Получаем JWT

                token =
                    data.session.access_token;



                // Скрываем вход

                document.getElementById("loginBlock")
                    .classList.add("hidden");



                // Показываем админку

                document.getElementById("adminBlock")
                    .classList.remove("hidden");



                // Загружаем все мероприятия

                loadEvents();

            };



        // =========================================
        // ЗАГРУЗКА ВСЕХ МЕРОПРИЯТИЙ
        // =========================================

        async function loadEvents() {


            const eventsBlock =
                document.getElementById("events");


            eventsBlock.textContent =
                "Загрузка...";



            try {


                const response =
                    await fetch(

                        API_URL + "/api/events",

                        {

                            method: "GET",

                            headers: {

                                Authorization:
                                    "Bearer " + token

                            }

                        }

                    );



                const data =
                    await response.json();



                // Ошибка backend

                if (!response.ok) {

                    eventsBlock.textContent =
                        "Ошибка: " + data.error;

                    return;

                }



                // Проверяем, что пришёл массив

                if (!Array.isArray(data)) {

                    eventsBlock.textContent =
                        "Backend вернул не массив мероприятий.";

                    return;

                }



                // Очищаем список

                eventsBlock.innerHTML = "";



                // Если мероприятий нет

                if (data.length === 0) {

                    eventsBlock.textContent =
                        "Мероприятий пока нет.";

                    return;

                }



                // Показываем количество

                const count =
                    document.createElement("p");

                count.innerHTML =
                    "<b>Всего мероприятий: " +
                    data.length +
                    "</b>";

                eventsBlock.appendChild(count);



                // Перебираем ВСЕ мероприятия

                data.forEach(event => {


                    const div =
                        document.createElement("div");


                    div.className =
                        "event";



                    div.innerHTML = `

                        <h3>
                            ${event.title ?? "Без названия"}
                        </h3>

                        <p>
                            <b>ID:</b>
                            ${event.id}
                        </p>

                        <p>
                            <b>Статус:</b>
                            ${event.status ?? ""}
                        </p>

                        <p>
                            <b>Описание:</b>
                            ${event.description ?? ""}
                        </p>

                        <p>
                            <b>Дата начала:</b>
                            ${formatDate(event.start_date)}
                        </p>

                        <p>
                            <b>Дата окончания:</b>
                            ${formatDate(event.end_date)}
                        </p>

                        <p>
                            <b>Цена:</b>
                            ${event.price ?? ""}
                        </p>

                        <p>
                            <b>Изображение:</b>
                            ${event.image_url ?? ""}
                        </p>

                        <p>
                            <b>Источник:</b>
                            ${event.source_url ?? ""}
                        </p>

                        <p>
                            <b>Организатор:</b>
                            ${event.broadcaster ?? ""}
                        </p>

                        <p>
                            <b>18+:</b>
                            ${event["18+"] ? "Да" : "Нет"}
                        </p>

                    `;



                    // =================================
                    // КНОПКА ИЗМЕНИТЬ
                    // =================================

                    const editButton =
                        document.createElement("button");


                    editButton.textContent =
                        "Изменить";


                    editButton.onclick =
                        () => editEvent(event);



                    // =================================
                    // КНОПКА УДАЛИТЬ
                    // =================================

                    const deleteButton =
                        document.createElement("button");


                    deleteButton.textContent =
                        "Удалить";


                    deleteButton.onclick =
                        () => deleteEvent(event.id);



                    div.appendChild(editButton);

                    div.appendChild(deleteButton);


                    eventsBlock.appendChild(div);

                });


            } catch (error) {

                eventsBlock.textContent =
                    "Ошибка соединения с backend: " +
                    error.message;

            }

        }



        // =========================================
        // ФОРМАТИРОВАНИЕ ДАТЫ
        // =========================================

        function formatDate(date) {


            if (!date) {

                return "";

            }


            return new Date(date)
                .toLocaleString("ru-RU");

        }



        // =========================================
        // ОТКРЫТЬ ФОРМУ СОЗДАНИЯ
        // =========================================

        document.getElementById("createEventButton")
            .onclick =
            () => {


                editingEventId = null;


                document.getElementById("formTitle")
                    .textContent =
                    "Создать мероприятие";


                clearForm();


                document.getElementById("eventForm")
                    .classList.remove("hidden");

            };



        // =========================================
        // ОТКРЫТЬ ФОРМУ РЕДАКТИРОВАНИЯ
        // =========================================

        function editEvent(event) {


            editingEventId =
                event.id;



            document.getElementById("formTitle")
                .textContent =
                "Изменить мероприятие";



            document.getElementById("eventTitle")
                .value =
                event.title ?? "";



            document.getElementById("eventStatus")
                .value =
                event.status ?? "pending";



            document.getElementById("eventDescription")
                .value =
                event.description ?? "";



            document.getElementById("eventStartDate")
                .value =
                toDateInput(event.start_date);



            document.getElementById("eventEndDate")
                .value =
                toDateInput(event.end_date);



            document.getElementById("eventPrice")
                .value =
                event.price ?? "";



            document.getElementById("eventImage")
                .value =
                event.image_url ?? "";



            document.getElementById("eventSourceUrl")
                .value =
                event.source_url ?? "";



            document.getElementById("eventBroadcaster")
                .value =
                event.broadcaster ?? "";



            document.getElementById("event18")
                .checked =
                event["18+"] === true;



            document.getElementById("eventForm")
                .classList.remove("hidden");



            // Перемещаем страницу к форме

            document.getElementById("eventForm")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }



        // =========================================
        // ПРЕОБРАЗОВАНИЕ ДАТЫ
        // =========================================

        function toDateInput(date) {


            if (!date) {

                return "";

            }



            const d =
                new Date(date);



            const year =
                d.getFullYear();


            const month =
                String(d.getMonth() + 1)
                    .padStart(2, "0");


            const day =
                String(d.getDate())
                    .padStart(2, "0");


            const hours =
                String(d.getHours())
                    .padStart(2, "0");


            const minutes =
                String(d.getMinutes())
                    .padStart(2, "0");



            return (
                year +
                "-" +
                month +
                "-" +
                day +
                "T" +
                hours +
                ":" +
                minutes
            );

        }



        // =========================================
        // ОЧИСТИТЬ ФОРМУ
        // =========================================

        function clearForm() {


            document.getElementById("eventTitle")
                .value = "";



            document.getElementById("eventStatus")
                .value = "pending";



            document.getElementById("eventDescription")
                .value = "";



            document.getElementById("eventStartDate")
                .value = "";



            document.getElementById("eventEndDate")
                .value = "";



            document.getElementById("eventPrice")
                .value = "";



            document.getElementById("eventImage")
                .value = "";



            document.getElementById("eventSourceUrl")
                .value = "";



            document.getElementById("eventBroadcaster")
                .value = "";



            document.getElementById("event18")
                .checked = false;



            document.getElementById("formResult")
                .textContent = "";

        }



        // =========================================
        // СОХРАНЕНИЕ
        // =========================================

        document.getElementById("saveEvent")
            .onclick =
            async () => {


                const eventData = {


                    title:
                        document.getElementById("eventTitle")
                            .value,


                    status:
                        document.getElementById("eventStatus")
                            .value,


                    description:
                        document.getElementById("eventDescription")
                            .value,


                    start_date:
                        getDateValue("eventStartDate"),


                    end_date:
                        getDateValue("eventEndDate"),


                    price:
                        getPriceValue(),


                    image_url:
                        document.getElementById("eventImage")
                            .value,


                    source_url:
                        document.getElementById("eventSourceUrl")
                            .value,


                    broadcaster:
                        document.getElementById("eventBroadcaster")
                            .value,


                    "18+":
                        document.getElementById("event18")
                            .checked

                };



                // =================================
                // СОЗДАНИЕ
                // =================================

                if (editingEventId === null) {


                    const response =
                        await fetch(

                            API_URL + "/api/events",

                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    Authorization:
                                        "Bearer " + token

                                },

                                body:
                                    JSON.stringify(eventData)

                            }

                        );



                    const data =
                        await response.json();



                    if (!response.ok) {

                        document.getElementById("formResult")
                            .textContent =
                            "Ошибка: " + data.error;

                        return;

                    }



                    document.getElementById("formResult")
                        .textContent =
                        "Мероприятие создано!";

                }



                // =================================
                // РЕДАКТИРОВАНИЕ
                // =================================

                else {


                    const response =
                        await fetch(

                            API_URL +
                            "/api/events/" +
                            editingEventId,

                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    Authorization:
                                        "Bearer " + token

                                },

                                body:
                                    JSON.stringify(eventData)

                            }

                        );



                    const data =
                        await response.json();



                    if (!response.ok) {

                        document.getElementById("formResult")
                            .textContent =
                            "Ошибка: " + data.error;

                        return;

                    }



                    document.getElementById("formResult")
                        .textContent =
                        "Мероприятие изменено!";

                }



                // Обновляем список

                await loadEvents();



                // Закрываем форму

                document.getElementById("eventForm")
                    .classList.add("hidden");

            };



        // =========================================
        // ПОЛУЧЕНИЕ ДАТЫ
        // =========================================

        function getDateValue(id) {


            const value =
                document.getElementById(id).value;



            if (!value) {

                return null;

            }



            return new Date(value)
                .toISOString();

        }



        // =========================================
        // ПОЛУЧЕНИЕ ЦЕНЫ
        // =========================================

        function getPriceValue() {


            const value =
                document.getElementById("eventPrice")
                    .value;



            if (value === "") {

                return null;

            }



            return Number(value);

        }



        // =========================================
        // ОТМЕНА ФОРМЫ
        // =========================================

        document.getElementById("cancelForm")
            .onclick =
            () => {


                document.getElementById("eventForm")
                    .classList.add("hidden");


                editingEventId = null;

            };



        // =========================================
        // УДАЛЕНИЕ
        // =========================================

        async function deleteEvent(id) {


            const confirmed =
                confirm(
                    "Удалить мероприятие?"
                );



            if (!confirmed) {

                return;

            }



            const response =
                await fetch(

                    API_URL +
                    "/api/events/" +
                    id,

                    {

                        method: "DELETE",

                        headers: {

                            Authorization:
                                "Bearer " + token

                        }

                    }

                );



            const data =
                await response.json();



            if (!response.ok) {

                alert(
                    "Ошибка: " + data.error
                );

                return;

            }



            // Обновляем список

            loadEvents();

        }



        // =========================================
        // ОБНОВИТЬ
        // =========================================

        document.getElementById("loadEvents")
            .onclick =
            () => loadEvents();



        // =========================================
        // ВЫХОД
        // =========================================

        document.getElementById("logout")
            .onclick =
            async () => {


                await supabase.auth.signOut();



                token = null;



                editingEventId = null;



                document.getElementById("loginBlock")
                    .classList.remove("hidden");



                document.getElementById("adminBlock")
                    .classList.add("hidden");



                document.getElementById("events")
                    .innerHTML = "";



                document.getElementById("eventForm")
                    .classList.add("hidden");

            };


    </script>


</body>

</html>
