name: Run Parser

on:
  workflow_dispatch: # Позволяет запускать парсер вручную кнопкой на сайте GitHub
  schedule:
    - cron: '0 8 * * *' # Запускается автоматически каждый день в 8:00 утра (по UTC)

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        runs: pip install requests

      - name: Run script
        run: python parser.py
