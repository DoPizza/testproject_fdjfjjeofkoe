<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Страница не найдена</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0b0b;
      color: #f2f2f2;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .error {
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }

    .code {
      margin: 0;

      font-size: clamp(100px, 16vw, 190px);
      line-height: 0.9;
      font-weight: 300;
      letter-spacing: -0.08em;

      color: #f2f2f2;
    }

    .message {
      margin: 42px 0 0;

      color: #777;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .message span {
      display: block;
    }

    .mark {
      position: relative;

      width: 150px;
      height: 70px;

      margin: 42px auto 0;
    }

    /* Земля */
    .ground {
      position: absolute;
      bottom: 8px;
      left: 0;

      width: 150px;
      height: 1px;

      background: #3a3a3a;
    }

    /* Холмик */
    .hill {
      position: absolute;
      bottom: 8px;
      left: 40px;

      width: 70px;
      height: 25px;

      border: 1px solid #444;
      border-bottom: 0;
      border-radius: 50% 50% 0 0;
    }

    /* Наклонённый указатель */
    .sign {
      position: absolute;
      left: 69px;
      bottom: 25px;

      width: 2px;
      height: 48px;

      background: #666;

      transform: rotate(20deg);
      transform-origin: bottom center;
    }

    .sign::before {
      content: "";

      position: absolute;
      left: -16px;
      top: -2px;

      width: 34px;
      height: 23px;

      border: 1px solid #666;
      background: #0b0b0b;

      transform: rotate(-20deg);
    }

    /* Травинка */
    .grass {
      position: absolute;
      bottom: 8px;
      left: 28px;

      width: 8px;
      height: 13px;

      border-left: 1px solid #444;
      transform: rotate(-25deg);
    }

    .grass::after {
      content: "";

      position: absolute;
      left: 4px;
      top: 2px;

      width: 8px;
      height: 13px;

      border-left: 1px solid #444;
      transform: rotate(45deg);
    }

    @media (max-width: 600px) {
      .error {
        padding: 30px 20px;
      }

      .message {
        margin-top: 30px;
        font-size: 15px;
      }

      .mark {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>

  <main class="error">
    <h1 class="code">404</h1>

    <p class="message">
      <span>Страница, которую вы ищете,</span>
      <span>не найдена.</span>
    </p>

    <div class="mark" aria-hidden="true">
      <div class="ground"></div>
      <div class="hill"></div>
      <div class="sign"></div>
      <div class="grass"></div>
    </div>
  </main>

</body>
</html>
