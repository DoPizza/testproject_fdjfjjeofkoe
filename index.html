
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Афиша Ульяновска</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 25px;
        }

        #events-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }


        /* ==========================================
           ИЗОБРАЖЕНИЕ В КАРТОЧКЕ
           ========================================== */

        .event-image-wrapper {
            width: 100%;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eeeeee;

            cursor: pointer;
            overflow: hidden;
        }

        .event-image {
            width: 100%;
            height: 100%;

            /*
             * contain сохраняет ВСЁ изображение.
             * Ничего не обрезается.
             */
            object-fit: contain;

            display: block;

            transition: transform 0.2s ease;
        }

        .event-image-wrapper:hover .event-image {
            transform: scale(1.02);
        }


        /* Если изображения нет */

        .event-image-placeholder {
            height: 220px;
            background: #e9e9e9;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #888;
        }


        /* ==========================================
           СОДЕРЖИМОЕ КАРТОЧКИ
           ========================================== */

        .event-content {
            padding: 20px;
        }

        .event-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-description {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 15px;
        }


        /* ==========================================
           ДАТА
           ========================================== */

        .event-date {
            background: #f1f5ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .event-countdown {
            font-size: 18px;
            font-weight: bold;
            color: #2457d6;
        }

        .event-date-full {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }


        /* ==========================================
           ИНФОРМАЦИЯ
           ========================================== */

        .event-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .event-badge {
            padding: 6px 10px;
            border-radius: 6px;
            background: #eee;
            font-size: 14px;
        }

        .event-price {
            background: #e8f7e8;
        }

        .event-age {
            background: #ffe7e7;
            color: #b00000;
            font-weight: bold;
        }


        /* ==========================================
           ВЕЩАТЕЛЬ
           ========================================== */

        .event-broadcaster {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .event-broadcaster a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .event-broadcaster a:hover {
            text-decoration: underline;
        }

        .event-broadcaster span {
            font-weight: bold;
        }


        /* ==========================================
           ИСТОЧНИК
           ========================================== */

        .event-source {
            font-size: 14px;
            margin-top: 5px;
        }

        .event-source a {
            color: #0066cc;
            text-decoration: none;
        }

        .event-source a:hover {
            text-decoration: underline;
        }


        /* ==========================================
           ОКНО УВЕЛИЧЕННОГО ИЗОБРАЖЕНИЯ
           ========================================== */

        .image-modal {
            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.85);

            align-items: center;
            justify-content: center;

            padding: 30px;

            cursor: pointer;
        }


        /* Показываем окно */

        .image-modal.active {
            display: flex;
        }


        /* Большое изображение */

        .image-modal img {
            max-width: 95%;
            max-height: 95%;

            /*
             * Изображение полностью помещается
             * в окно и не обрезается.
             */
            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 5px 30px rgba(0, 0, 0, 0.5);

            cursor: default;
        }


        /* Кнопка закрытия */

        .image-modal-close {
            position: absolute;

            top: 20px;
            right: 25px;

            color: white;

            font-size: 40px;
            font-weight: bold;

            cursor: pointer;

            line-height: 1;

            z-index: 10000;
        }

        .image-modal-close:hover {
            opacity: 0.7;
        }


        /* ==========================================
           ОШИБКИ
           ========================================== */

        .error {
            color: red;
        }

        .empty {
            color: #666;
        }


        /* ==========================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ========================================== */

        @media (max-width: 600px) {

            body {
                margin: 20px auto;
                padding: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .event-image-wrapper {
                height: 180px;
            }

            .event-image-placeholder {
                height: 180px;
            }

            .event-content {
                padding: 15px;
            }

            .event-title {
                font-size: 21px;
            }

            .image-modal {
                padding: 10px;
            }

            .image-modal img {
                max-width: 100%;
                max-height: 90%;
            }

        }

    </style>
</head>


<body>


    <h1>📅 Афиша мероприятий Ульяновска</h1>


    <div id="events-container">
        Загрузка мероприятий...
    </div>



    <!-- ==========================================
         ОКНО УВЕЛИЧЕННОГО ИЗОБРАЖЕНИЯ
         ========================================== -->

    <div
        id="image-modal"
        class="image-modal"
    >

        <div
            id="image-modal-close"
            class="image-modal-close"
        >
            ×
        </div>

        <img
            id="modal-image"
            src=""
            alt="Увеличенное изображение"
        >

    </div>



    <script>


        // ==========================================
        // URL API
        // ==========================================

        const BACKEND_URL =
            "https://fangdenim-lwsvow.stormkit.dev/api/events";



        // ==========================================
        // Элементы окна изображения
        // ==========================================

        const imageModal =
            document.getElementById("image-modal");

        const modalImage =
            document.getElementById("modal-image");

        const imageModalClose =
            document.getElementById("image-modal-close");



        // ==========================================
        // Открыть изображение
        // ==========================================

        function openImage(imageUrl) {

            modalImage.src = imageUrl;

            imageModal.classList.add("active");

            document.body.style.overflow = "hidden";

        }



        // ==========================================
        // Закрыть изображение
        // ==========================================

        function closeImage() {

            imageModal.classList.remove("active");

            modalImage.src = "";

            document.body.style.overflow = "";

        }



        // ==========================================
        // Клик по кнопке ×
        // ==========================================

        imageModalClose.addEventListener(
            "click",
            closeImage
        );



        // ==========================================
        // Клик по затемнённому фону
        // ==========================================

        imageModal.addEventListener(
            "click",
            function(event) {

                /*
                 * Закрываем только если пользователь
                 * нажал именно на фон, а не на картинку.
                 */

                if (event.target === imageModal) {
                    closeImage();
                }

            }
        );



        // ==========================================
        // Закрытие по Escape
        // ==========================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    imageModal.classList.contains("active")
                ) {

                    closeImage();

                }

            }
        );



        // ==========================================
        // Форматирование даты
        // ==========================================

        function formatDate(date) {

            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).format(date);

        }



        // ==========================================
        // Склонение слов
        // ==========================================

        function getWord(
            number,
            one,
            two,
            five
        ) {

            const n =
                Math.abs(number) % 100;

            const n1 =
                n % 10;


            if (
                n > 10 &&
                n < 20
            ) {

                return five;

            }


            if (
                n1 > 1 &&
                n1 < 5
            ) {

                return two;

            }


            if (n1 === 1) {

                return one;

            }


            return five;

        }



        // ==========================================
        // Обратный отсчёт
        // ==========================================

        function getCountdown(startDate) {

            const now =
                new Date();


            const difference =
                startDate - now;


            // Мероприятие уже началось

            if (difference <= 0) {

                return "🔴 Уже началось";

            }


            const totalMinutes =
                Math.floor(
                    difference / 1000 / 60
                );


            const days =
                Math.floor(
                    totalMinutes / 1440
                );


            const hours =
                Math.floor(
                    (totalMinutes % 1440) / 60
                );


            const minutes =
                totalMinutes % 60;



            // Несколько дней

            if (days > 0) {

                return `
                    🕐 Начнётся через
                    ${days}
                    ${getWord(
                        days,
                        "день",
                        "дня",
                        "дней"
                    )}
                `;

            }



            // Несколько часов

            if (hours > 0) {

                return `
                    🕐 Начнётся через
                    ${hours}
                    ${getWord(
                        hours,
                        "час",
                        "часа",
                        "часов"
                    )}
                `;

            }



            // Меньше часа

            return `
                🕐 Начнётся через
                ${minutes}
                ${getWord(
                    minutes,
                    "минуту",
                    "минуты",
                    "минут"
                )}
            `;

        }



        // ==========================================
        // Создание карточки
        // ==========================================

        function createEventCard(event) {

            const card =
                document.createElement("div");


            card.className =
                "event-card";



            // ======================================
            // ИЗОБРАЖЕНИЕ
            // ======================================

            let imageHTML = "";


            if (
                event.image_url &&
                event.image_url.trim() !== ""
            ) {

                /*
                 * Здесь изображение помещается
                 * в небольшую область.
                 *
                 * object-fit: contain
                 * НЕ ОБРЕЗАЕТ изображение.
                 */

                imageHTML = `

                    <div
                        class="event-image-wrapper"
                        onclick="openImage('${event.image_url}')"
                    >

                        <img
                            class="event-image"
                            src="${event.image_url}"
                            alt="${event.title || "Мероприятие"}"
                            loading="lazy"
                        >

                    </div>

                `;

            }

            else {

                imageHTML = `

                    <div class="event-image-placeholder">

                        🖼️ Нет изображения

                    </div>

                `;

            }



            // ======================================
            // ДАТА
            // ======================================

            let dateHTML = "";


            if (event.start_date) {

                const startDate =
                    new Date(
                        event.start_date
                    );


                if (
                    !isNaN(
                        startDate.getTime()
                    )
                ) {

                    dateHTML = `

                        <div class="event-date">

                            <div class="event-countdown">

                                ${getCountdown(
                                    startDate
                                )}

                            </div>


                            <div class="event-date-full">

                                ${formatDate(
                                    startDate
                                )}

                            </div>

                        </div>

                    `;

                }

            }



            // ======================================
            // ЦЕНА
            // ======================================

            let priceHTML = "";


            if (
                event.price !== null &&
                event.price !== undefined &&
                event.price !== ""
            ) {

                priceHTML = `

                    <div
                        class="event-badge event-price"
                    >

                        💰 ${event.price} ₽

                    </div>

                `;

            }



            // ======================================
            // 18+
            // ======================================

            let ageHTML = "";


            if (
                event["18+"] === true
            ) {

                ageHTML = `

                    <div
                        class="event-badge event-age"
                    >

                        🔞 18+

                    </div>

                `;

            }



            // ======================================
            // ВЕЩАТЕЛЬ
            // ======================================

            let broadcasterHTML = "";


            if (event.broadcaster) {


                // Есть ссылка

                if (
                    event.source_url &&
                    event.source_url.trim() !== ""
                ) {

                    broadcasterHTML = `

                        <div
                            class="event-broadcaster"
                        >

                            📢 Вещатель:

                            <a
                                href="${event.source_url}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                ${event.broadcaster}

                            </a>

                        </div>

                    `;

                }


                // Нет ссылки

                else {

                    broadcasterHTML = `

                        <div
                            class="event-broadcaster"
                        >

                            📢🔗 Вещатель:

                            <span>

                                ${event.broadcaster}

                            </span>

                        </div>

                    `;

                }

            }



            


            // ======================================
            // СОБИРАЕМ КАРТОЧКУ
            // ======================================

            card.innerHTML = `


                ${imageHTML}



                <div class="event-content">


                    <!-- Название -->

                    <div class="event-title">

                        ${event.title || "Без названия"}

                    </div>



                    <!-- Описание -->

                    ${
                        event.description
                            ? `

                                <div
                                    class="event-description"
                                >

                                    ${event.description}

                                </div>

                              `
                            : ""
                    }



                    <!-- Дата -->

                    ${dateHTML}



                    <!-- Цена / статус / 18+ -->

                    <div class="event-info">


                        ${priceHTML}



                        ${
                            event.status
                                ? `

                                    <div
                                        class="event-badge"
                                    >

                                        Статус:
                                        ${event.status}

                                    </div>

                                  `
                                : ""
                        }



                        ${ageHTML}


                    </div>



                    <!-- Вещатель -->

                    ${broadcasterHTML}



                    <!-- Источник -->

                    ${sourceHTML}


                </div>

            `;


            return card;

        }



        // ==========================================
        // Загрузка мероприятий
        // ==========================================

        async function loadEvents() {

            const container =
                document.getElementById(
                    "events-container"
                );


            try {


                const response =
                    await fetch(
                        BACKEND_URL
                    );



                // Проверяем HTTP статус

                if (!response.ok) {

                    throw new Error(
                        `HTTP ошибка: ${response.status}`
                    );

                }



                // Получаем JSON

                const events =
                    await response.json();



                // Проверяем массив

                if (
                    !Array.isArray(events)
                ) {

                    throw new Error(
                        "API вернул не массив мероприятий"
                    );

                }



                // Нет мероприятий

                if (
                    events.length === 0
                ) {

                    container.innerHTML = `

                        <p class="empty">

                            Пока нет добавленных
                            мероприятий.

                        </p>

                    `;

                    return;

                }



                // Очищаем

                container.innerHTML = "";



                // Создаём карточки

                events.forEach(
                    event => {

                        const card =
                            createEventCard(
                                event
                            );


                        container.appendChild(
                            card
                        );

                    }
                );


            }


            catch (error) {


                console.error(
                    "Ошибка загрузки:",
                    error
                );



                container.innerHTML = `

                    <p class="error">

                        Не удалось загрузить
                        мероприятия.

                        <br><br>

                        Ошибка:
                        ${error.message}

                    </p>

                `;

            }

        }



        // ==========================================
        // Первая загрузка
        // ==========================================

        loadEvents();



        // ==========================================
        // Обновляем каждую минуту
        // ==========================================

        setInterval(
            () => {

                loadEvents();

            },
            60000
        );


    </script>


</body>
</html>
