
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Афиша Ульяновска — Тест</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f2f2;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #events {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );

            gap: 20px;
        }

        .event-card {
            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }

        .event-image-wrapper {
            width: 100%;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            background: #eeeeee;

            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;
        }

        .event-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            transition:
                transform 0.2s ease;
        }

        .event-image-wrapper:hover .event-image {
            transform: scale(1.03);
        }

        .no-image {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #888;

            font-size: 16px;
        }

        .event-title {
            margin: 0 0 10px;

            font-size: 22px;
            line-height: 1.25;
        }

        .event-description {
            margin-bottom: 15px;

            line-height: 1.5;

            color: #555;
        }

        .event-status {
            display: inline-block;

            padding: 5px 10px;

            margin-bottom: 12px;

            border-radius: 20px;

            background: #eeeeee;

            font-size: 14px;
            font-weight: bold;
        }

        .event-date {
            margin-bottom: 10px;

            font-weight: bold;
        }

        .event-price {
            margin-bottom: 10px;

            font-weight: bold;
        }

        .event-broadcaster {
            margin-top: 10px;
            margin-bottom: 10px;

            line-height: 1.4;
        }

        .event-broadcaster a {
            color: inherit;

            font-weight: bold;

            text-decoration: none;
        }

        .event-broadcaster a:hover {
            text-decoration: underline;
        }

        .age-limit {
            display: inline-block;

            margin-top: 5px;

            padding: 5px 9px;

            border-radius: 6px;

            background: #ffe0e0;

            color: #c00;

            font-size: 14px;
            font-weight: bold;
        }

        .loading {
            text-align: center;

            padding: 40px;

            color: #777;
        }

        .error {
            text-align: center;

            padding: 30px;

            color: #c00;

            background: #ffeaea;

            border-radius: 10px;
        }


        /* ======================================
           МОДАЛЬНОЕ ОКНО ИЗОБРАЖЕНИЯ
           ====================================== */

        .image-modal {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.88);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 9999;

            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-image {
            max-width: 95%;
            max-height: 95%;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;

            top: 15px;
            right: 25px;

            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 40px;

            cursor: pointer;

            user-select: none;

            z-index: 10000;
        }

        .image-modal-close:hover {
            opacity: 0.7;
        }


        /* ======================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ====================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 26px;
            }

            #events {
                grid-template-columns: 1fr;
            }

            .event-image-wrapper {
                height: 180px;
            }

            .event-title {
                font-size: 20px;
            }

            .image-modal {
                padding: 10px;
            }

            .modal-image {
                max-width: 100%;
                max-height: 90%;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            Афиша Ульяновска — Тест
        </h1>

        <div id="events">

            <div class="loading">
                Загрузка мероприятий...
            </div>

        </div>

    </div>


    <!-- ======================================
         МОДАЛЬНОЕ ОКНО
         ====================================== -->

    <div
        id="image-modal"
        class="image-modal"
    >

        <div
            id="image-modal-close"
            class="image-modal-close"
        >
            ×
        </div>

        <img
            id="modal-image"
            class="modal-image"
            src=""
            alt="Увеличенное изображение"
        >

    </div>


    <script>

        const BACKEND_URL =
            "http://localhost:8888/api/events/approved";


        // ======================================
        // ФОРМАТИРОВАНИЕ ДАТЫ
        // ======================================

        function formatStartDate(dateString) {

            if (!dateString) {
                return "Дата не указана";
            }

            const date =
                new Date(dateString);

            if (isNaN(date.getTime())) {
                return "Некорректная дата";
            }


            const now =
                new Date();

            const difference =
                date.getTime() -
                now.getTime();


            // Мероприятие уже началось
            if (difference <= 0) {

                return "🔴 Уже началось";

            }


            const minutes =
                Math.floor(
                    difference /
                    (1000 * 60)
                );


            const hours =
                Math.floor(
                    minutes / 60
                );


            const days =
                Math.floor(
                    hours / 24
                );


            if (days > 1) {

                return `📅 Начнётся через ${days} дней`;

            }


            if (days === 1) {

                return `📅 Начнётся через 1 день`;

            }


            if (hours > 1) {

                return `⏰ Начнётся через ${hours} часов`;

            }


            if (hours === 1) {

                return `⏰ Начнётся через 1 час`;

            }


            if (minutes > 1) {

                return `⏱️ Начнётся через ${minutes} минут`;

            }


            if (minutes === 1) {

                return `⏱️ Начнётся через 1 минуту`;

            }


            return "⏱️ Начнётся совсем скоро";

        }


        // ======================================
        // ОТКРЫТИЕ ИЗОБРАЖЕНИЯ
        // ======================================

        function openImage(url) {

            if (!url) {
                return;
            }


            const modal =
                document.getElementById(
                    "image-modal"
                );

            const modalImage =
                document.getElementById(
                    "modal-image"
                );


            modalImage.src = url;

            modal.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }


        // ======================================
        // ЗАКРЫТИЕ ИЗОБРАЖЕНИЯ
        // ======================================

        function closeImage() {

            const modal =
                document.getElementById(
                    "image-modal"
                );

            const modalImage =
                document.getElementById(
                    "modal-image"
                );


            modal.classList.remove(
                "active"
            );


            modalImage.src = "";


            document.body.style.overflow =
                "";

        }


        // ======================================
        // ЗАГРУЗКА МЕРОПРИЯТИЙ
        // ======================================

        async function loadEvents() {

            const container =
                document.getElementById(
                    "events"
                );


            try {

                const response =
                    await fetch(
                        BACKEND_URL
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const events =
                    await response.json();


                if (
                    !Array.isArray(events) ||
                    events.length === 0
                ) {

                    container.innerHTML = `
                        <div class="loading">
                            Мероприятий пока нет
                        </div>
                    `;

                    return;

                }


                container.innerHTML =
                    events.map(
                        event => {


                            // ======================================
                            // ИЗОБРАЖЕНИЕ
                            // ======================================

                            let imageHTML = "";


                            if (
                                event.image_url &&
                                event.image_url.trim() !== ""
                            ) {

                                imageHTML = `

                                    <div
                                        class="event-image-wrapper"
                                        onclick="openImage('${event.image_url}')"
                                    >

                                        <img
                                            class="event-image"
                                            src="${event.image_url}"
                                            alt="${event.title || "Изображение мероприятия"}"
                                        >

                                    </div>

                                `;

                            } else {

                                imageHTML = `

                                    <div
                                        class="event-image-wrapper"
                                    >

                                        <div class="no-image">
                                            🖼️ Нет изображения
                                        </div>

                                    </div>

                                `;

                            }


                            // ======================================
                            // ВЕЩАТЕЛЬ
                            // ======================================

                            let broadcasterHTML = "";


                            if (
                                event.broadcaster &&
                                event.broadcaster.trim() !== ""
                            ) {

                                if (
                                    event.source_url &&
                                    event.source_url.trim() !== ""
                                ) {

                                    broadcasterHTML = `

                                        <div
                                            class="event-broadcaster"
                                        >

                                            📢 Вещатель:

                                            <a
                                                href="${event.source_url}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >
                                                ${event.broadcaster}
                                            </a>

                                        </div>

                                    `;

                                } else {

                                    broadcasterHTML = `

                                        <div
                                            class="event-broadcaster"
                                        >

                                            📢 Вещатель:

                                            <b>
                                                ${event.broadcaster}
                                            </b>

                                        </div>

                                    `;

                                }

                            }


                            // ======================================
                            // 18+
                            // ======================================

                            let ageHTML = "";


                            if (
                                event["18+"] === true
                            ) {

                                ageHTML = `

                                    <div class="age-limit">
                                        🔞 18+
                                    </div>

                                `;

                            }


                            // ======================================
                            // ЦЕНА
                            // ======================================

                            let priceHTML = "";


                            if (
                                event.price !== null &&
                                event.price !== undefined &&
                                event.price !== ""
                            ) {

                                priceHTML = `

                                    <div class="event-price">
                                        💰 ${event.price} ₽
                                    </div>

                                `;

                            }


                            // ======================================
                            // КАРТОЧКА
                            // ======================================

                            return `

                                <div
                                    class="event-card"
                                >

                                    ${imageHTML}


                                    <h2
                                        class="event-title"
                                    >
                                        ${event.title || "Без названия"}
                                    </h2>


                                    ${
                                        event.status
                                        ? `
                                            <div
                                                class="event-status"
                                            >
                                                ${event.status}
                                            </div>
                                        `
                                        : ""
                                    }


                                    ${
                                        event.description
                                        ? `
                                            <div
                                                class="event-description"
                                            >
                                                ${event.description}
                                            </div>
                                        `
                                        : ""
                                    }


                                    <div
                                        class="event-date"
                                    >
                                        ${formatStartDate(
                                            event.start_date
                                        )}
                                    </div>


                                    ${priceHTML}


                                    ${broadcasterHTML}


                                    ${ageHTML}

                                </div>

                            `;

                        }
                    ).join("");


            } catch (error) {

                console.error(
                    "Ошибка загрузки мероприятий:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        ❌ Не удалось загрузить мероприятия

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }


        // ======================================
        // ЗАКРЫТИЕ ПО КНОПКЕ X
        // ======================================

        document
            .getElementById(
                "image-modal-close"
            )
            .addEventListener(
                "click",
                closeImage
            );


        // ======================================
        // ЗАКРЫТИЕ ПО КЛИКУ НА ФОН
        // ======================================

        document
            .getElementById(
                "image-modal"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeImage();

                    }

                }
            );


        // ======================================
        // ЗАКРЫТИЕ ПО ESC
        // ======================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeImage();

                }

            }
        );


        // ======================================
        // ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА
        // ======================================

        loadEvents();


        // ======================================
        // ОБНОВЛЕНИЕ ОБРАТНОГО ОТСЧЁТА
        // КАЖДУЮ МИНУТУ
        // ======================================

        setInterval(
            () => {
                loadEvents();
            },
            60000
        );

    </script>

</body>

</html>
